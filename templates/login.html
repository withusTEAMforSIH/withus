{% extends "base.html" %}

{% block title %}Log in — WithUS{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in</h1>
        <p class="auth-lede">Private, judgment-free — every time.</p>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@email.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn btn-primary btn-lg auth-submit">Log in →</button>
        </form>

        <p class="auth-switch">
            New to WithUS? <a href="{{ url_for('signup') }}">Create an account</a>
        </p>

        <p class="auth-switch auth-switch-muted">
            Are you a doctor? <a href="{{ url_for('doctor_login') }}">Log in here</a>
        </p>
    </div>
</section>

{% endblock %}
