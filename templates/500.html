{% extends "base.html" %}

{% block title %}Something went wrong — WithUS{% endblock %}

{% block content %}

        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Back to home →</a>
    </div>
</section>

{% endblock %}
