<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | WithUS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

<div class="chat-page">

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div>
                <h2>WithUS Chat</h2>

                <p>
                    {% if current_user_type == 'user' %}
                        Chat with Dr. {{ appointment.doctor.name }}
                    {% else %}
                        Chat with {{ appointment.user.name }}
                    {% endif %}
                </p>
            </div>

            <div class="chat-status">
                ● Connected
            </div>

        </div>


        <!-- Messages -->

        <div class="chat-messages" id="chatMessages">

            {% for msg in messages %}

                <div class="chat-message
                    {% if msg.sender_type == current_user_type %}
                        sent
                    {% else %}
                        received
                    {% endif %}
                ">

                    <div class="message-bubble">
                        {{ msg.message }}
                    </div>

                    <span class="message-time">
                        {{ msg.created_at.strftime('%H:%M') }}
                    </span>

                </div>

            {% endfor %}

        </div>


        <!-- Input -->

        <form id="chatForm" class="chat-input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</div>


<script>

const socket = io();

const appointmentId = {{ appointment.id }};

const currentUserType = "{{ current_user_type }}";

const messagesContainer =
    document.getElementById("chatMessages");

const messageInput =
    document.getElementById("messageInput");

const chatForm =
    document.getElementById("chatForm");


// Join appointment chat

socket.emit("join_chat", {
    appointment_id: appointmentId
});


// Receive new message

socket.on("new_message", function(data) {

    const messageWrapper =
        document.createElement("div");

    messageWrapper.classList.add(
        "chat-message"
    );

    if (data.sender_type === currentUserType) {

        messageWrapper.classList.add("sent");

    } else {

        messageWrapper.classList.add("received");

    }


    messageWrapper.innerHTML = `

        <div class="message-bubble">
            ${escapeHtml(data.message)}
        </div>

        <span class="message-time">
            ${data.created_at}
        </span>

    `;

    messagesContainer.appendChild(
        messageWrapper
    );

    scrollToBottom();
});


// Send message

chatForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    socket.emit("send_message", {

        appointment_id: appointmentId,

        message: message

    });

    messageInput.value = "";

    messageInput.focus();

});


// Keep latest messages visible

function scrollToBottom() {

    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

}


// Prevent HTML injection

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


scrollToBottom();

</script>

</body>

</html>
