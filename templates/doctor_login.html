{% extends "base.html" %}

{% block title %}Doctor login — WithUS{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card auth-card-doctor">
        <span class="eyebrow eyebrow-doctor">For doctors</span>
        <h1>Log in to your dashboard</h1>
        <p class="auth-lede">View your appointments and patient sessions.</p>

        <form method="POST" action="{{ url_for('doctor_login') }}" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="doctor@withus.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn btn-primary btn-lg auth-submit">Log in →</button>
        </form>

        <p class="auth-switch auth-switch-muted">
            Not a doctor? <a href="{{ url_for('login') }}">Log in as a patient</a>
        </p>
    </div>
</section>

{% endblock %}
